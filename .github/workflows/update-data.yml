name: Update data

on:
  schedule:
    - cron: "30 1 * * *"  # every day at 01:30 UTC (after the US market has closed)
  workflow_dispatch:       # can also be started by hand from the Actions tab

permissions:
  contents: write          # needed to commit the updated JSON files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline (download, clean, backtest)
        run: python run_all.py

      - name: Commit the updated JSON files
        run: |
          # The commit is made in the name of the repository owner: Vercel's free
          # plan only publishes commits that belong to the project owner.
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "Update data (automatic)"
          git push
